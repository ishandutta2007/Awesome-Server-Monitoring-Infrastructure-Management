<svg fill="none" viewBox="0 0 1200 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes scanline {
        0% { transform: translateY(-100px); }
        100% { transform: translateY(400px); }
      }
      @keyframes livePing {
        0% { r: 4px; opacity: 1; }
        100% { r: 14px; opacity: 0; }
      }
      @keyframes floatDot {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes waveDash {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -120; }
      }
      .pulse-circle {
        transform-origin: center;
        animation: pulseGlow 6s ease-in-out infinite;
      }
      .ping-bubble {
        animation: livePing 2s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      .floating-node {
        animation: floatDot 4s ease-in-out infinite;
      }
      .animated-wave {
        stroke-dasharray: 8 6;
        animation: waveDash 4s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" rx="16" fill="url(#grid)"/>

  <!-- Dynamic Animated Glow Orbs in Background -->
  <circle class="pulse-circle" cx="200" cy="90" r="140" fill="url(#glowGrad)" />
  <circle class="pulse-circle" cx="1020" cy="270" r="160" fill="url(#glowGrad)" style="animation-delay: -3s;" />

  <!-- Dynamic Server Rack / Infrastructure Silhouette Backdrop -->
  <g opacity="0.22">
    <!-- Server Grid Outlines (Left) -->
    <rect x="50" y="50" width="130" height="42" rx="5" stroke="#38bdf8" stroke-width="1.5" fill="#0f172a" />
    <circle cx="70" cy="71" r="4" fill="#10b981" />
    <circle cx="85" cy="71" r="4" fill="#38bdf8" />
    <line x1="105" y1="71" x2="160" y2="71" stroke="#334155" stroke-width="2" stroke-linecap="round" />

    <rect x="50" y="105" width="130" height="42" rx="5" stroke="#38bdf8" stroke-width="1.5" fill="#0f172a" />
    <circle cx="70" cy="126" r="4" fill="#10b981" />
    <circle cx="85" cy="126" r="4" fill="#f59e0b" />
    <line x1="105" y1="126" x2="160" y2="126" stroke="#334155" stroke-width="2" stroke-linecap="round" />

    <rect x="50" y="160" width="130" height="42" rx="5" stroke="#38bdf8" stroke-width="1.5" fill="#0f172a" />
    <circle cx="70" cy="181" r="4" fill="#10b981" />
    <circle cx="85" cy="181" r="4" fill="#10b981" />
    <line x1="105" y1="181" x2="160" y2="181" stroke="#334155" stroke-width="2" stroke-linecap="round" />

    <!-- Server Grid Outlines (Right) -->
    <rect x="1020" y="50" width="130" height="42" rx="5" stroke="#818cf8" stroke-width="1.5" fill="#0f172a" />
    <circle cx="1040" cy="71" r="4" fill="#10b981" />
    <circle cx="1055" cy="71" r="4" fill="#38bdf8" />
    <line x1="1075" y1="71" x2="1130" y2="71" stroke="#334155" stroke-width="2" stroke-linecap="round" />

    <rect x="1020" y="105" width="130" height="42" rx="5" stroke="#818cf8" stroke-width="1.5" fill="#0f172a" />
    <circle cx="1040" cy="126" r="4" fill="#10b981" />
    <circle cx="1055" cy="126" r="4" fill="#10b981" />
    <line x1="1075" y1="126" x2="1130" y2="126" stroke="#334155" stroke-width="2" stroke-linecap="round" />

    <rect x="1020" y="160" width="130" height="42" rx="5" stroke="#818cf8" stroke-width="1.5" fill="#0f172a" />
    <circle cx="1040" cy="181" r="4" fill="#38bdf8" />
    <circle cx="1055" cy="181" r="4" fill="#10b981" />
    <line x1="1075" y1="181" x2="1130" y2="181" stroke="#334155" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Dynamic Real-Time Metric Wave (Telemetry / Health Pulse) -->
  <path class="animated-wave" d="M 0 310 Q 150 300 250 280 T 450 310 T 650 260 T 850 295 T 1050 270 T 1200 300" 
        fill="none" stroke="url(#lineGrad)" stroke-width="2.5" />
  <path d="M 0 310 Q 150 300 250 280 T 450 310 T 650 260 T 850 295 T 1050 270 T 1200 300 L 1200 360 L 0 360 Z" 
        fill="url(#lineGrad)" opacity="0.06" />

  <!-- Top Status Badge (Live Operational Health) -->
  <g transform="translate(485, 42)">
    <rect width="230" height="30" rx="15" fill="#1e293b" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
    <circle cx="22" cy="15" r="4.5" fill="#10b981" />
    <circle class="ping-bubble" cx="22" cy="15" r="5" stroke="#10b981" stroke-width="1.5" fill="none" />
    <text x="36" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.2">SYSTEM HEALTH: 99.99%</text>
  </g>

  <!-- Foreground Main Title -->
  <g transform="translate(600, 150)" text-anchor="middle">
    <text fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Display', Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.6))">
      Server Monitoring &amp; Infrastructure
    </text>
  </g>

  <!-- Foreground Subtitle -->
  <g transform="translate(600, 198)" text-anchor="middle">
    <text fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" letter-spacing="0.3" opacity="0.95">
      Awesome Curated Observability, Telemetry &amp; IT Management Platforms
    </text>
  </g>

  <!-- Tech Tags / Dynamic Capsules (Foreground Center-Bottom) -->
  <g transform="translate(600, 248)" text-anchor="middle">
    <!-- Tag 1 -->
    <g transform="translate(-320, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.9"/>
      <text y="4" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ Real-Time APM</text>
    </g>
    <!-- Tag 2 -->
    <g transform="translate(-160, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.2" opacity="0.9"/>
      <text y="4" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📈 Metrics &amp; TSDB</text>
    </g>
    <!-- Tag 3 -->
    <g transform="translate(0, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" opacity="0.9"/>
      <text y="4" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🌐 Network SNMP</text>
    </g>
    <!-- Tag 4 -->
    <g transform="translate(160, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" opacity="0.9"/>
      <text y="4" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛡️ Infrastructure</text>
    </g>
    <!-- Tag 5 -->
    <g transform="translate(320, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" opacity="0.9"/>
      <text y="4" fill="#e879f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔔 Smart Alerting</text>
    </g>
  </g>

  <!-- Border Accent -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="15.5" stroke="#334155" stroke-width="1" fill="none" opacity="0.8" />
</svg>
